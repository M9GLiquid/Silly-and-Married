name: Inspect Netlify Deploy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query failed dev deploy metadata
        shell: bash
        run: |
          set -u
          deploy_id="6a6ddfd175693300082296e9"
          endpoint="https://api.netlify.com/api/v1/deploys/$deploy_id"
          status=$(curl -sS -L -D /tmp/netlify-headers.txt -o /tmp/netlify-deploy.json -w "%{http_code}" "$endpoint" || true)
          echo "HTTP status: $status"
          echo "Response headers:"
          cat /tmp/netlify-headers.txt
          echo
          echo "Response body:"
          cat /tmp/netlify-deploy.json
          echo
