[build]
  command = "echo Static site ready"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/media-list"
  to = "/.netlify/functions/media-list"
  status = 200

[[redirects]]
  from = "/api/onedrive-create-upload-session"
  to = "/.netlify/functions/onedrive-create-upload-session"
  status = 200

[[redirects]]
  from = "/api/onedrive-save-metadata"
  to = "/.netlify/functions/onedrive-save-metadata"
  status = 200

[[redirects]]
  from = "/api/onedrive-health"
  to = "/.netlify/functions/onedrive-health"
  status = 200

[[redirects]]
  from = "/api/onedrive-verify-upload"
  to = "/.netlify/functions/onedrive-verify-upload"
  status = 200

[[redirects]]
  from = "/api/onedrive-upload-list"
  to = "/.netlify/functions/onedrive-upload-list"
  status = 200

[[redirects]]
  from = "/api/onedrive-media"
  to = "/.netlify/functions/onedrive-media"
  status = 200
