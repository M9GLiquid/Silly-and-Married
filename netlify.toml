[build]
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/media-list"
  to = "/.netlify/functions/media-list"
  status = 200

[[redirects]]
  from = "/api/onedrive-create-upload-session"
  to = "/.netlify/functions/onedrive-create-upload-session"
  status = 200

[[redirects]]
  from = "/api/onedrive-save-metadata"
  to = "/.netlify/functions/onedrive-save-metadata"
  status = 200

[[redirects]]
  from = "/api/onedrive-health"
  to = "/.netlify/functions/onedrive-health"
  status = 200

[[redirects]]
  from = "/api/onedrive-verify-upload"
  to = "/.netlify/functions/onedrive-verify-upload"
  status = 200
